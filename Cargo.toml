[package]
name = "aurora-installer"
version = "1.0.0"
edition = "2024"
authors = ["Ahum Maitra <theahummaitra@gmail.com>"]
license = "GPL-3.0-or-later"
description = "Fast, beautiful Ratatui-based TUI installer for Aurora on Arch Linux, Fedora, and NixOS"
repository = "https://github.com/TheAhumMaitra/Aurora"
homepage = "https://hypraurora.vercel.app/"

[[bin]]
name = "aurora-installer"
path = "src/main.rs"

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.40.1"
which = "8.0.6"
